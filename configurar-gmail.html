<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Gmail · Gestão RH</title>
<style>body{font:16px system-ui;background:#eff5fb;color:#102958;max-width:680px;margin:60px auto;padding:20px}main{background:white;padding:28px;border-radius:14px}label{display:block;margin:20px 0}button{background:#174887;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}input{display:block;margin-top:8px}a{color:#174887}</style>
<main><h1>Configurar Gmail</h1><p>Selecione o arquivo de credenciais do aplicativo Web baixado do Google Cloud. Ele será armazenado no disco privado do serviço.</p><form id="form"><label>Credencial Google (.json)<input type="file" id="credential" accept=".json,application/json" required></label><button type="submit">Salvar credencial</button></form><p id="message" role="status"></p><p><a href="/">Voltar ao painel</a></p></main>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter,m=document.getElementById('message');b.disabled=true;try{const credential=JSON.parse(await document.getElementById('credential').files[0].text());const r=await fetch('/api/gmail/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credential)});const result=await r.json();if(!r.ok)throw Error(result.error);m.textContent='Credencial salva. Volte ao painel e clique em Conectar Gmail.';}catch(err){m.textContent='Não foi possível salvar: '+err.message;b.disabled=false;}};</script></html>
