const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?new Date(s.slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'Não informada';
let requestVersion=0;
function clearResult(){requestVersion++;$('result').replaceChildren();$('message').textContent='';}

$('firstName').oninput=clearResult;
$('phone').oninput=e=>{const digits=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=digits.replace(/^(\d{2})(\d)/,'($1) $2').replace(digits.length>10?/(\d{5})(\d)/:/(\d{4})(\d)/,'$1-$2');clearResult();};
$('form').onsubmit=async e=>{e.preventDefault();const version=++requestVersion;$('result').replaceChildren();$('submit').disabled=true;$('message').textContent='Consultando…';try{const r=await fetch('/api/consulta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:$('phone').value,firstName:$('firstName').value})}),d=await r.json();if(version!==requestVersion)return;if(!r.ok)throw Error(d.error);const active=d.jobs.filter(j=>!j.closed&&!['Reprovado','Sem interesse','Contratado'].includes(j.stage));$('message').textContent='';$('result').innerHTML=`<div class="card"><small>SEU CADASTRO</small><h2>${esc(d.name)}</h2><p>${esc(d.city)}</p><h3>${active.length?'Você participa de '+active.length+' seleção(ões).':'Você não está concorrendo a uma vaga no momento.'}</h3>${d.jobs.length?'<p>Última vaga: '+esc(d.jobs[0].role)+' · '+esc(d.jobs[0].company)+'</p>':'<p>Nenhuma participação registrada.</p>'}${d.jobs.map(j=>`<details><summary>${esc(j.role)} · ${esc(j.company)}</summary><p>${j.closed?'Seleção encerrada':'Seleção em aberto'} · ${esc(j.stage)}</p><p>Data da entrevista: ${date(j.date)}</p><p>${esc(j.feedback||'Ainda não há um retorno registrado.')}</p>${j.history.map(h=>'<p>'+date(h.at)+' · '+esc(h.stage)+'</p>').join('')}</details>`).join('')}</div>`;}catch(err){if(version===requestVersion)$('message').textContent=err.message;}finally{$('submit').disabled=false;}};
