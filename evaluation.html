<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Avaliação de experiência · Gestão RH Consultoria</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#182b4b;font:15px/1.6 Arial,sans-serif}main{max-width:960px;margin:auto;padding:36px 22px}header{display:flex;align-items:center;gap:30px;margin-bottom:28px}header img{width:145px;height:auto;background:white;border-radius:12px;padding:10px}h1{font-size:30px;line-height:1.2;margin:8px 0}h2{font-size:20px}h3{font-size:15px;margin:0 0 4px}.eyebrow{font-size:11px;letter-spacing:2px;color:#204b8f;font-weight:bold}.card{background:white;border:1px solid #dce4ef;border-radius:12px;padding:25px;margin:18px 0}.muted{color:#65758d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{font-size:13px}.field b{display:block;color:#65758d;font-size:11px;text-transform:uppercase}fieldset{border:0;border-bottom:1px solid #dce4ef;padding:18px 0;margin:0}legend{font-weight:bold;font-size:15px;padding-top:16px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rating{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #dce4ef;border-radius:8px;font-size:12px}.rating:has(input:checked){background:#e4f2fa;border-color:#008fc4}.question{margin:0 0 12px;color:#65758d;font-size:13px}label{display:block}input,textarea,select{font:inherit}input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;padding:11px;border:1px solid #cbd8eb;border-radius:7px;margin:6px 0 16px;background:white}textarea{min-height:95px}input{accent-color:#204b8f}button{background:#204b8f;color:white;border:0;padding:13px 22px;border-radius:8px;font:inherit;cursor:pointer}button:disabled{opacity:.6}.error{color:#a33}.notice{border-left:4px solid #008fc4;background:#e4f2fa;padding:16px}.check{display:flex;gap:10px;align-items:start;margin:12px 0}.success{padding:30px;border:1px solid #cbd8eb;background:white;border-radius:12px} @media(max-width:600px){header{gap:15px}header img{width:100px}h1{font-size:24px}.grid{grid-template-columns:1fr}.ratings{grid-template-columns:1fr 1fr}.card{padding:18px}}@media print{body{background:white}main{padding:0}.card{break-inside:avoid}button{display:none}}
</style></head><body><main><header><img src="/assets/gestao-rh-logo.jpeg" alt="Gestão RH Consultoria"><div><div class="eyebrow">Acompanhamento do contratado</div><h1>Avaliação de experiência</h1><p class="muted">Desenvolvimento, desempenho e integração.</p></div></header><div id="status" role="status">Carregando avaliação…</div><div id="app"></div></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'Não informado',token=location.pathname.split('/').at(-1);
(async()=>{try{const r=await fetch('/api/evaluation/'+token),d=await r.json();if(!r.ok)throw Error(d.error);$('status').textContent='';const s=d.snapshot;$('app').innerHTML=`<div class="card"><div class="eyebrow">Avaliação de ${d.period} dias · prevista para ${date(d.dueDate)}</div><h2>${esc(s.name)}</h2><div class="grid">${[['Empresa',s.company],['Função',s.role],['Admissão',date(s.admissionDate)],['Unidade / setor',[s.unit,s.sector].filter(Boolean).join(' / ')],['Formação',s.education],['Curso',s.course]].map(([l,v])=>`<div class="field"><b>${l}</b>${esc(v||'Não informado')}</div>`).join('')}</div></div>`;if(d.submittedAt){$('app').innerHTML+='<div class="success"><h2>Avaliação já registrada</h2><p>A Gestão RH recebeu esta avaliação em '+date(d.submittedAt)+'. Obrigado pela participação.</p></div>';return;}
const form=document.createElement('form');form.id='evaluationForm';form.innerHTML=`<p class="notice">Avalie o período com base em situações observadas. Marque uma nota por critério: 1 é abaixo do esperado e 4 é acima do esperado.</p>${[...new Set(d.schema.questions.map(q=>q.group))].map(group=>`<section class="card"><h2>${esc(group)}</h2>${d.schema.questions.filter(q=>q.group===group).map(q=>`<fieldset><legend>${esc(q.title)}</legend><p class="question">${esc(q.text)}</p><div class="ratings">${d.schema.scale.map((label,i)=>`<label class="rating"><input type="radio" name="${q.id}" value="${i+1}" required><span><b>${i+1}</b> · ${esc(label)}</span></label>`).join('')}</div></fieldset>`).join('')}</section>`).join('')}<section class="card"><h2>Plano de desenvolvimento</h2><label>Conhecimentos a desenvolver ou aperfeiçoar<textarea name="knowledge" maxlength="4000" placeholder="Ex.: processos internos, ferramentas e conhecimentos técnicos"></textarea></label><label>Habilidades a desenvolver ou aperfeiçoar<textarea name="skills" maxlength="4000" placeholder="Ex.: comunicação, atendimento e trabalho em equipe"></textarea></label><label>Tipo de treinamento<select name="trainingType" required><option value="">Selecione</option>${d.schema.trainingTypes.map(t=>'<option>'+esc(t)+'</option>').join('')}</select></label><p>Modalidades indicadas (pode escolher mais de uma)</p>${d.schema.trainingModes.map(t=>`<label class="check"><input type="checkbox" name="trainingModes" value="${esc(t)}">${esc(t)}</label>`).join('')}<label>Especifique os treinamentos e ações recomendados<textarea name="trainingDetails" maxlength="4000"></textarea></label></section><section class="card"><h2>Parecer do gestor</h2><label>Recomendação<select name="recommendation" required><option value="">Selecione</option>${d.schema.recommendations.map(t=>'<option>'+esc(t)+'</option>').join('')}</select></label><label>Comentários e exemplos observados<textarea name="comments" maxlength="4000"></textarea></label><div class="grid"><label>Nome completo do avaliador<input name="manager" maxlength="200" required autocomplete="name"></label><label>Cargo do avaliador<input name="managerRole" maxlength="200"></label></div><label class="check"><input type="checkbox" name="confirmed" required><span>Confirmo que revisei as respostas e sou responsável por esta avaliação.</span></label><p class="muted">O envio identifica o avaliador pelo nome informado e registra data e hora. Após enviar, as respostas ficam preservadas no histórico da Gestão RH.</p><p id="formError" class="error" role="alert"></p><button type="submit">Enviar avaliação</button></section>`;$('app').append(form);form.onsubmit=async e=>{e.preventDefault();const values=new FormData(form),body=Object.fromEntries(values);body.trainingModes=values.getAll('trainingModes');body.confirmed=values.get('confirmed')==='on';body.ratings=Object.fromEntries(d.schema.questions.map(q=>[q.id,Number(values.get(q.id))]));const b=e.submitter;b.disabled=true;try{const r=await fetch('/api/evaluation/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await r.json();if(!r.ok)throw Error(result.error);form.innerHTML='<div class="success"><h2>Avaliação enviada!</h2><p>As respostas foram registradas. Obrigado por contribuir com o acompanhamento do contratado.</p></div>';form.scrollIntoView({behavior:'smooth'});}catch(err){$('formError').textContent=err.message;b.disabled=false;}};}catch(err){$('status').textContent=err.message;}})();
</script></body></html>
