<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar dados · Gestão RH</title>
<style>body{font:16px system-ui;background:#eff5fb;color:#102958;max-width:680px;margin:60px auto;padding:20px}main{background:white;padding:28px;border-radius:14px}label{display:block;margin:20px 0}button{background:#174887;color:white;border:0;padding:12px 20px;border-radius:7px;cursor:pointer}input{display:block;margin-top:8px}a{color:#174887}</style>
<main><h1>Importar dados da Gestão RH</h1><p>Use esta tela apenas para a primeira importação. Os arquivos são enviados para o armazenamento privado deste serviço.</p><form id="form"><label>Arquivo de candidatos (candidates.json)<input type="file" id="candidates" accept=".json,application/json" required></label><label>Arquivo de histórico (state.json)<input type="file" id="state" accept=".json,application/json" required></label><button type="submit">Importar dados</button></form><p id="message" role="status"></p><p><a href="/">Voltar ao painel</a></p></main>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter,m=document.getElementById('message');b.disabled=true;m.textContent='Importando, aguarde...';try{const candidates=JSON.parse(await document.getElementById('candidates').files[0].text()),state=JSON.parse(await document.getElementById('state').files[0].text());const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidates,state})});const result=await r.json();if(!r.ok)throw Error(result.error);m.textContent=result.count+' candidatos importados. Volte ao painel para conferir.';}catch(err){m.textContent='Não foi possível importar: '+err.message;b.disabled=false;}};</script></html>
