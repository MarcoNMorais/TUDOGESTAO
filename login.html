<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrar · Gestão RH Consultoria</title><link rel="icon" href="/assets/gestao-rh-logo.jpeg"><style>
:root{--ink:#182b4b;--blue:#204b8f;--cyan:#008fc4;--paper:#f4f7fc;--line:#dce4ef}*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:linear-gradient(135deg,#e5f3fa,#f4f7fc 55%,#e4ebf8);color:var(--ink);font:15px/1.5 Arial,sans-serif}.card{width:min(440px,100%);padding:34px;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px #10295718}.logo{display:block;width:168px;height:auto;margin:0 auto 22px}.eyebrow{text-align:center;letter-spacing:2px;font-size:10px;color:var(--blue);font-weight:700}.card h1{text-align:center;font-size:27px;margin:6px 0}.hint{text-align:center;color:#65758d;font-size:13px;margin-bottom:24px}label{display:block;font-size:12px;font-weight:700;margin:15px 0 6px}input{width:100%;padding:12px 13px;border:1px solid #cbd8eb;border-radius:8px;font:inherit;color:var(--ink)}input:focus{outline:2px solid var(--cyan);outline-offset:1px}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:var(--blue);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.65}#error{min-height:22px;color:#a33;font-size:12px;margin-top:12px}footer{text-align:center;color:#75839b;font-size:11px;margin-top:20px}
</style></head><body><main class="card"><img class="logo" src="/assets/gestao-rh-logo.jpeg" alt="Gestão RH Consultoria"><div class="eyebrow">ÁREA ADMINISTRATIVA</div><h1>Entrar no painel</h1><p class="hint">Use seu usuário e senha para acessar Empresas, vagas e candidatos.</p><form id="loginForm"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" autocapitalize="words" required autofocus><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">Entrar</button><p id="error" role="alert"></p></form><footer>Gestão RH Consultoria · acesso restrito</footer></main><script src="/login.js"></script></body></html>
